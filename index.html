<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu">
    <h1>FOOD MENU</h1>
    <p class="info">100% Veg Fast Food</p>

    <div class="menu-row">
        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349" alt="Burger">
        <div class="details">
            <h3>Veg Burger</h3>
            <p>Crispy patty with fresh veggies</p>
            <span>₹99</span>
        </div>
    </div>

    <div class="menu-row reverse">
        <img src="pizza.jpg" alt="Pizza">
        <div class="details">
            <h3>Veg Pizza</h3>
            <p>Loaded with cheese & vegetables</p>
            <span>₹199</span>
        </div>
    </div>

    <div class="menu-row">
        <img src="french fries.jpg" alt="Fries">
        <div class="details">
            <h3>French Fries</h3>
            <p>Golden & crispy</p>
            <span>₹69</span>
        </div>
    </div>

    <div class="menu-row reverse">
        <img src="momos.jpg" alt="Momos">
        <div class="details">
            <h3>Veg Momos</h3>
            <p>Steamed & spicy</p>
            <span>₹89</span>
        </div>
    </div>

    <footer>
        <p>📍 Street Food Corner | ☎ </p>
    </footer>
</div>

</body>
</html>
